# Supabase local/remote CLI config — see https://supabase.com/docs/guides/cli
project_id = "ejitwihwpridtemzcjhu"

[api]
enabled = true
port = 54321
schemas = ["public", "graphql_public"]
extra_search_path = ["public", "extensions"]
max_rows = 1000

[db]
port = 54322
shadow_port = 54320
major_version = 15

[db.migrations]
enabled = true

[db.seed]
enabled = true
sql_paths = ["./seed.sql"]

[studio]
enabled = true
port = 54323

[auth]
enabled = true
site_url = "http://localhost:8080"
additional_redirect_urls = [
  "http://localhost:8080/admin/login",
  "http://localhost:8080/admin/reset-password",
  "http://localhost:8080/parent/reset-password",
  "http://localhost:5173/admin/login",
  "http://localhost:5173/admin/reset-password",
  "http://localhost:5173/parent/reset-password",
]
jwt_expiry = 3600
enable_signup = false

[auth.email]
enable_signup = false
enable_confirmations = false

[storage]
enabled = true
file_size_limit = "50MiB"
